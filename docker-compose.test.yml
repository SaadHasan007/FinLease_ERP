services:
  test_db:
    image: postgres:16-alpine
    container_name: finlease_test_db
    environment:
      POSTGRES_DB: finlease_test
      POSTGRES_USER: finlease_test
      POSTGRES_PASSWORD: finlease_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finlease_test -d finlease_test"]
      interval: 5s
      timeout: 3s
      retries: 5

  test_redis:
    image: redis:7-alpine
    container_name: finlease_test_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
